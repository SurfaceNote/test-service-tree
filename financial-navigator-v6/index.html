<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Финансовый навигатор — комплексное финансовое сопровождение</title>
<style>
html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#f4f7f3;color:#152a22}.loading{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center}.loading-card{max-width:560px;background:#fff;border:1px solid #dce5df;border-radius:24px;padding:34px;box-shadow:0 22px 65px rgba(20,65,46,.11)}.loading-mark{width:52px;height:52px;margin:0 auto 18px;border-radius:15px;background:#14734d;color:#fff;display:grid;place-items:center;font-size:28px}.loading h1{font-family:Georgia,serif;margin:0 0 10px}.loading p{color:#6d7d75}.loading a{color:#14734d;font-weight:700}
</style>
</head>
<body>
<div class="loading"><div class="loading-card"><div class="loading-mark">↗</div><h1>Финансовый навигатор</h1><p>Загружаем обновлённую версию сайта…</p></div></div>
<script>
const sourceUrl='https://raw.githubusercontent.com/SurfaceNote/test-service-tree/financial-navigator-demo/financial-navigator-v5/index.html';
const hero=`<section class="hero">
  <div class="wrap heroGrid">
    <div class="heroCopy">
      <div class="tag"><span class="dot"></span>Финансовое сопровождение для ИП и ООО</div>
      <h1>Берём финансы бизнеса <span>под контроль</span></h1>
      <p class="lead">Ведём бухгалтерский и налоговый учёт, внедряем ДДС, ОПиУ и управленческий баланс, составляем финансовые модели и помогаем собственнику принимать решения на основе цифр.</p>
      <div class="actions">
        <button class="btn green" type="button" data-consult>Получить консультацию →</button>
        <a class="btn" href="#services">Посмотреть все услуги</a>
      </div>
      <div class="heroMeta" aria-label="Условия работы">
        <span>✓ Работаем онлайн</span><span>✓ Разовые задачи и сопровождение</span><span>✓ Для ИП и ООО</span>
      </div>
    </div>
    <div class="servicePanel" aria-label="Услуги Финансового навигатора">
      <div class="servicePanelTop">
        <div><small>Комплексное финансовое сопровождение</small><strong>Что можем взять на себя</strong></div>
        <span>6 направлений</span>
      </div>
      <div class="serviceGrid">
        <a class="serviceItem" href="#services"><span class="serviceIcon">▤</span><div><h3>Бухгалтерское сопровождение</h3><p>Учёт, отчётность и контроль документов без просрочек.</p><em>Порядок в учёте</em></div></a>
        <a class="serviceItem" href="#services"><span class="serviceIcon">%</span><div><h3>Налоги и отчётность</h3><p>Расчёт нагрузки, выбор режима и снижение налоговых рисков.</p><em>Прогнозируемые платежи</em></div></a>
        <a class="serviceItem" href="#services"><span class="serviceIcon">▥</span><div><h3>Управленческий учёт</h3><p>ДДС, ОПиУ, баланс, план-факт и аналитика направлений.</p><em>Реальная картина бизнеса</em></div></a>
        <a class="serviceItem" href="#services"><span class="serviceIcon">↗</span><div><h3>Финансовый директор</h3><p>Бюджеты, показатели, контроль исполнения и решения для роста.</p><em>Система управления</em></div></a>
        <a class="serviceItem" href="#shop"><span class="serviceIcon">ƒ</span><div><h3>Финансовые модели</h3><p>Прогноз выручки, расходов, прибыли и сценариев развития.</p><em>Решения до вложений</em></div></a>
        <a class="serviceItem" href="#calculator"><span class="serviceIcon">◎</span><div><h3>Аудит и диагностика</h3><p>Поиск ошибок, кассовых разрывов, слабых мест и резервов.</p><em>План конкретных действий</em></div></a>
      </div>
      <div class="servicePanelBottom"><span><b>От разовой задачи</b> до полноценного финансового отдела</span><a href="#services">Перейти к услугам и стоимости →</a></div>
    </div>
  </div>
</section>`;
const heroCss=`<style>
.heroCopy h1{max-width:690px;font-size:66px;line-height:1.01}.heroCopy .lead{max-width:680px}.heroMeta{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:30px;color:var(--muted);font-size:11px;font-weight:700}.servicePanel{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}.servicePanelTop{min-height:72px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}.servicePanelTop div{display:grid;gap:2px}.servicePanelTop small{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.servicePanelTop strong{font-size:20px}.servicePanelTop>span{padding:7px 10px;border-radius:999px;background:var(--soft);color:var(--green);font-size:9px;font-weight:800;white-space:nowrap}.serviceGrid{display:grid;grid-template-columns:1fr 1fr;padding:10px}.serviceItem{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:15px;border:1px solid transparent;border-radius:16px;transition:.22s}.serviceItem:hover{background:var(--soft2);border-color:var(--line);transform:translateY(-2px)}.serviceIcon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--green);font-size:19px;font-weight:900}.serviceItem h3{margin:0 0 4px;font-size:13px;line-height:1.25}.serviceItem p{margin:0;color:var(--muted);font-size:9.5px;line-height:1.45}.serviceItem em{display:block;margin-top:7px;color:var(--green);font-size:8.5px;font-style:normal;font-weight:800}.servicePanelBottom{padding:14px 20px;border-top:1px solid var(--line);background:#f8faf8;display:flex;align-items:center;justify-content:space-between;gap:18px;font-size:9.5px;color:var(--muted)}.servicePanelBottom b{color:var(--ink)}.servicePanelBottom a{color:var(--green);font-weight:800;white-space:nowrap}@media(max-width:980px){.heroCopy{text-align:left}.servicePanel{max-width:760px;margin:auto}.heroCopy h1{font-size:58px}.heroMeta{justify-content:flex-start}}@media(max-width:640px){.heroCopy h1{font-size:43px}.heroCopy .lead{font-size:16px}.serviceGrid{grid-template-columns:1fr}.servicePanelTop{align-items:flex-start}.servicePanelBottom{align-items:flex-start;flex-direction:column}.heroMeta{display:grid;gap:8px}.hero .actions{display:grid}.hero .actions .btn{width:100%}}
</style>`;
fetch(sourceUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(html=>{
  html=html.replace(/<section class="hero">[\s\S]*?<\/section>/,hero);
  html=html.replace('</head>',heroCss+'</head>');
  document.open();document.write(html);document.close();
}).catch(error=>{
  document.body.innerHTML='<div class="loading"><div class="loading-card"><div class="loading-mark">!</div><h1>Не удалось загрузить обновление</h1><p>Откройте предыдущую стабильную версию сайта.</p><p><a href="'+sourceUrl+'">Открыть Финансовый навигатор</a></p></div></div>';
  console.error(error);
});
</script>
</body>
</html>
