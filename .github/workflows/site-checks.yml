name: Site checks
on:
  push:
    branches: [financial-navigator-final, gh-pages]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python scripts/check_site.py
      - run: node --check assets/data.js
      - run: node --check assets/core.js
      - run: node --check assets/diagnostics.js
      - run: node --check assets/diagnostics-engine.js
      - run: node --check assets/diagnostics-dashboard.js
      - run: node --check assets/diagnostics-boundary-fixes.js
      - run: node --check assets/pages.js
      - run: node tests/diagnostics-engine.test.js
