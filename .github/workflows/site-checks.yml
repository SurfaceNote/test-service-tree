name: Site checks
on:
  push:
    branches: [gh-pages, agent/financial-diagnostics-v3]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python scripts/check_site.py
      - run: node --check assets/data.js
      - run: node --check assets/core.js
      - run: node --check assets/diagnostics-engine.js
      - run: node --check assets/diagnostics-v3.js
      - run: node --check assets/home-roadmap.js
      - run: node --check assets/service-expertise-data.js
      - run: node --check assets/service-passport-details.js
      - run: node --check assets/pages.js
      - run: node tests/diagnostics-engine.test.js
      - run: node tests/diagnostics-v3.test.js
      - run: node tests/home-roadmap.test.js
      - run: node tests/service-expertise.test.js
      - run: node tests/service-passport-details.test.js
