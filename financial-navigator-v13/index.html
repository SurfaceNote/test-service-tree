<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Финансовый навигатор</title><style>body{margin:0;background:#f4f7f4;color:#142a21;font:16px Arial;display:grid;place-items:center;min-height:100vh}.c{text-align:center;padding:30px}.m{width:52px;height:52px;margin:auto;border-radius:15px;background:#11764a;color:#fff;display:grid;place-items:center;font-size:28px}</style></head><body><div class="c"><div class="m">↗</div><h1>Финансовый навигатор</h1><p>Загружаем интерактивный прототип…</p></div><script>(async()=>{try{const s=(await Promise.all(['p1.txt','p2.txt','p3.txt','p4.txt','p5.txt'].map(x=>fetch(x).then(r=>{if(!r.ok)throw Error(r.status);return r.text()})))).join('');const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<div class="c"><div class="m">!</div><h1>Не удалось открыть прототип</h1><p>Обновите страницу или используйте актуальную версию браузера.</p></div>'}})();</script></body></html>
