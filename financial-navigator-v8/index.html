<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Финансовый навигатор — расширенный перечень финансовых услуг</title>
<style>
html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#f4f7f3;color:#152a22}.loading{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center}.loading-card{max-width:560px;background:#fff;border:1px solid #dce5df;border-radius:24px;padding:34px;box-shadow:0 22px 65px rgba(20,65,46,.11)}.loading-mark{width:52px;height:52px;margin:0 auto 18px;border-radius:15px;background:#14734d;color:#fff;display:grid;place-items:center;font-size:28px}.loading h1{font-family:Georgia,serif;margin:0 0 10px}.loading p{color:#6d7d75}.loading a{color:#14734d;font-weight:700}
</style>
</head>
<body>
<div class="loading"><div class="loading-card"><div class="loading-mark">↗</div><h1>Финансовый навигатор</h1><p>Загружаем версию сайта с расширенным перечнем услуг…</p></div></div>
<script>
const sourceUrl='https://raw.githubusercontent.com/SurfaceNote/test-service-tree/financial-navigator-demo/financial-navigator-v5/index.html';
const hero=`<section class="hero">
  <div class="wrap heroGrid">
    <div class="heroCopy">
      <div class="tag"><span class="dot"></span>Финансовое сопровождение для ИП и ООО</div>
      <h1>Берём финансы бизнеса <span>под контроль</span></h1>
      <p class="lead">Ведём бухгалтерский и налоговый учёт, внедряем ДДС, ОПиУ и управленческий баланс, составляем финансовые модели и помогаем собственнику принимать решения на основе цифр.</p>
      <div class="actions">
        <button class="btn green" type="button" data-consult>Получить консультацию →</button>
        <a class="btn" href="#services">Посмотреть все услуги</a>
      </div>
      <div class="heroMeta" aria-label="Условия работы">
        <span>✓ Работаем онлайн</span><span>✓ Разовые задачи и сопровождение</span><span>✓ Для ИП и ООО</span>
      </div>
    </div>
    <div class="servicePanel" aria-label="Услуги Финансового навигатора">
      <div class="servicePanelTop">
        <div><small>Комплексное финансовое сопровождение</small><strong>Что можем взять на себя</strong></div>
        <span>8 направлений</span>
      </div>
      <div class="serviceGrid">
        <a class="serviceItem" href="#services"><span class="serviceIcon">▤</span><div><h3>Бухгалтерское сопровождение</h3><p>Учёт, отчётность и контроль документов без просрочек.</p><em>Порядок в учёте</em></div></a>
        <a class="serviceItem" href="#services"><span class="serviceIcon">%</span><div><h3>Налоги и отчётность</h3><p>Расчёт нагрузки, выбор режима и снижение налоговых рисков.</p><em>Прогнозируемые платежи</em></div></a>
        <a class="serviceItem" href="#services"><span class="serviceIcon">▥</span><div><h3>Управленческий учёт</h3><p>ДДС, ОПиУ, баланс, план-факт и аналитика направлений.</p><em>Реальная картина бизнеса</em></div></a>
        <a class="serviceItem" href="#services"><span class="serviceIcon">↗</span><div><h3>Финансовый директор</h3><p>Бюджеты, показатели, контроль исполнения и решения для роста.</p><em>Система управления</em></div></a>
        <a class="serviceItem" href="#shop"><span class="serviceIcon">ƒ</span><div><h3>Финансовые модели</h3><p>Прогноз выручки, расходов, прибыли и сценариев развития.</p><em>Решения до вложений</em></div></a>
        <a class="serviceItem" href="#calculator"><span class="serviceIcon">◎</span><div><h3>Аудит и диагностика</h3><p>Поиск ошибок, кассовых разрывов, слабых мест и резервов.</p><em>План конкретных действий</em></div></a>
        <a class="serviceItem" href="#services"><span class="serviceIcon">⌘</span><div><h3>Зарплата и кадровый учёт</h3><p>Расчёт зарплаты, взносов, НДФЛ и кадровые документы.</p><em>Снижение кадровых рисков</em></div></a>
        <a class="serviceItem" href="#services"><span class="serviceIcon">◔</span><div><h3>Казначейство</h3><p>Платёжный календарь, приоритет платежей и контроль разрывов.</p><em>Управляемый денежный поток</em></div></a>
      </div>
      <div class="servicePanelBottom"><span><b>От разовой задачи</b> до полноценного финансового отдела</span><a href="#services">Перейти ко всем услугам →</a></div>
    </div>
  </div>
</section>`;
const heroCss=`<style>
.heroCopy h1{max-width:690px;font-size:66px;line-height:1.01}.heroCopy .lead{max-width:680px}.heroMeta{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:30px;color:var(--muted);font-size:11px;font-weight:700}.servicePanel{background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}.servicePanelTop{min-height:72px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}.servicePanelTop div{display:grid;gap:2px}.servicePanelTop small{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.servicePanelTop strong{font-size:20px}.servicePanelTop>span{padding:7px 10px;border-radius:999px;background:var(--soft);color:var(--green);font-size:9px;font-weight:800;white-space:nowrap}.serviceGrid{display:grid;grid-template-columns:1fr 1fr;padding:10px}.serviceItem{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:15px;border:1px solid transparent;border-radius:16px;transition:.22s}.serviceItem:hover{background:var(--soft2);border-color:var(--line);transform:translateY(-2px)}.serviceIcon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--green);font-size:19px;font-weight:900}.serviceItem h3{margin:0 0 4px;font-size:13px;line-height:1.25}.serviceItem p{margin:0;color:var(--muted);font-size:9.5px;line-height:1.45}.serviceItem em{display:block;margin-top:7px;color:var(--green);font-size:8.5px;font-style:normal;font-weight:800}.servicePanelBottom{padding:14px 20px;border-top:1px solid var(--line);background:#f8faf8;display:flex;align-items:center;justify-content:space-between;gap:18px;font-size:9.5px;color:var(--muted)}.servicePanelBottom b{color:var(--ink)}.servicePanelBottom a{color:var(--green);font-weight:800;white-space:nowrap}@media(max-width:980px){.heroCopy{text-align:left}.servicePanel{max-width:760px;margin:auto}.heroCopy h1{font-size:58px}.heroMeta{justify-content:flex-start}}@media(max-width:640px){.heroCopy h1{font-size:43px}.heroCopy .lead{font-size:16px}.serviceGrid{grid-template-columns:1fr}.servicePanelTop{align-items:flex-start}.servicePanelBottom{align-items:flex-start;flex-direction:column}.heroMeta{display:grid;gap:8px}.hero .actions{display:grid}.hero .actions .btn{width:100%}}
</style>`;
const services=`<section class="section servicesSec" id="services"><div class="wrap"><div class="head"><div><div class="tag">Услуги и форматы сопровождения</div><h2>Сопровождение бизнеса<br>от учёта до решений</h2></div><p>Можно подключить отдельную услугу или собрать единую команду под задачи бизнеса. Стоимость определяется после знакомства с объёмом работ, состоянием учёта и уровнем ответственности.</p></div><div class="solutionGrid"><article class="solution"><span class="ico g">▤</span><h3>Бухгалтерское сопровождение</h3><p>Регулярное ведение учёта и контроль обязательной отчётности.</p><ul><li>бухгалтерский и налоговый учёт</li><li>первичные документы и банк</li><li>отчётность и сверки</li><li>ответы на требования</li></ul><button class="serviceCta" data-service="Бухгалтерское сопровождение">Обсудить задачу →</button></article><article class="solution"><span class="ico o">%</span><h3>Налоговое консультирование</h3><p>Оцениваем последствия решений и снижаем налоговые риски.</p><ul><li>выбор налогового режима</li><li>расчёт нагрузки</li><li>анализ договоров и операций</li><li>оценка налоговых рисков</li></ul><button class="serviceCta" data-service="Налоговое консультирование">Получить консультацию →</button></article><article class="solution"><span class="ico b">⌘</span><h3>Зарплата и кадровый учёт</h3><p>Берём под контроль расчёты с сотрудниками и кадровые документы.</p><ul><li>зарплата, взносы и НДФЛ</li><li>приём, отпуск и увольнение</li><li>кадровые документы</li><li>кадровый аудит</li></ul><button class="serviceCta" data-service="Зарплата и кадровый учёт">Подключить блок →</button></article><article class="solution"><span class="ico b">▥</span><h3>Управленческий учёт</h3><p>Формируем отчёты, по которым собственник видит прибыль и деньги.</p><ul><li>ДДС, ОПиУ и баланс</li><li>платёжный календарь</li><li>план-факт анализ</li><li>аналитика направлений</li></ul><a class="serviceCta" href="#calculator">Начать с диагностики →</a></article><article class="solution"><span class="ico p">↗</span><h3>Финансовый директор на аутсорсе</h3><p>Организуем финансовое управление и готовим решения для собственника.</p><ul><li>бюджетирование и KPI</li><li>контроль рентабельности</li><li>управленческие сессии</li><li>решения для роста</li></ul><button class="serviceCta" data-service="Финансовый директор">Обсудить формат →</button></article><article class="solution"><span class="ico p">◎</span><h3>Аудит, восстановление и диагностика</h3><p>Находим ошибки и восстанавливаем порядок в учёте и финансах.</p><ul><li>экспресс-аудит учёта</li><li>восстановление документов</li><li>анализ долгов и разрывов</li><li>план исправления</li></ul><button class="serviceCta" data-service="Аудит и диагностика">Запросить аудит →</button></article><article class="solution"><span class="ico g">∑</span><h3>Финансовые модели и бюджетирование</h3><p>Просчитываем запуск, развитие и инвестиционные сценарии до вложений.</p><ul><li>финансовая модель бизнеса</li><li>сценарный анализ</li><li>бюджет доходов и расходов</li><li>точка безубыточности</li></ul><button class="serviceCta" data-service="Финансовая модель">Заказать модель →</button></article><article class="solution"><span class="ico o">◔</span><h3>Казначейство и платёжный календарь</h3><p>Настраиваем контроль платежей и предотвращение кассовых разрывов.</p><ul><li>платёжный календарь</li><li>согласование платежей</li><li>контроль кассовых разрывов</li><li>ежедневный денежный контроль</li></ul><button class="serviceCta" data-service="Казначейство">Настроить контроль →</button></article></div></div></section>`;
const servicesCss=`<style>.solutionGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.solution{min-height:395px;padding:24px;border:1px solid var(--line);border-radius:22px;background:#fff;display:flex;flex-direction:column;transition:.22s}.solution:hover{transform:translateY(-5px);box-shadow:var(--shadow)}.solution .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:20px;font-weight:900;margin-bottom:22px}.solution .g{background:var(--soft);color:var(--green)}.solution .o{background:#f8eadc;color:#8d531d}.solution .b{background:#e8f1f8;color:#245d83}.solution .p{background:#eee8f7;color:#65498a}.solution h3{font-size:19px;line-height:1.25;margin:0 0 9px}.solution p{font-size:12px;color:var(--muted);margin:0 0 14px}.solution ul{padding:0;list-style:none;display:grid;gap:8px;margin:0 0 18px}.solution li{position:relative;padding-left:18px;font-size:11px}.solution li:before{content:'✓';position:absolute;left:0;color:var(--green);font-weight:900}.serviceCta{margin-top:auto;padding:0;border:0;background:none;color:var(--green);font:800 12px Arial;cursor:pointer;text-align:left}.serviceCta:hover{text-decoration:underline}@media(max-width:1050px){.solutionGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.solutionGrid{grid-template-columns:1fr}.solution{min-height:auto}}</style>`;
fetch(sourceUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(html=>{
  html=html.replace(/<section class="hero">[\s\S]*?<\/section>/,hero);
  html=html.replace('</head>',heroCss+servicesCss+'</head>');
  html=html.replace(/<section class="section servicesSec" id="services">[\s\S]*?<\/section>/,services);
  html=html.replace(/(<a href="#services">)\s*Решения\s*(<\/a>)/,'$1Услуги$2');
  html=html.replace(/(<header[\s\S]*?<a class="btn green" href=")[^"]*(">)\s*Проверить бизнес\s*(<\/a>)/,'$1#consult$2Получить консультацию$3');
  document.open();document.write(html);document.close();
}).catch(error=>{
  document.body.innerHTML='<div class="loading"><div class="loading-card"><div class="loading-mark">!</div><h1>Не удалось загрузить обновление</h1><p>Откройте предыдущую стабильную версию сайта.</p><p><a href="'+sourceUrl+'">Открыть Финансовый навигатор</a></p></div></div>';
  console.error(error);
});
</script>
</body>
</html>
