<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Финансовый навигатор — бухгалтерия, налоги, управленческий учёт и финансовое сопровождение для ИП и ООО.">
<title>Финансовый навигатор</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f7f4;color:#173026;font:16px Arial,sans-serif}.c{text-align:center;padding:32px;max-width:620px}.m{width:56px;height:56px;margin:auto;border-radius:16px;background:#0f7549;color:#fff;display:grid;place-items:center;font-size:28px}.s{width:34px;height:34px;margin:20px auto;border:4px solid #d9e5dd;border-top-color:#0f7549;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="c"><div class="m">↗</div><h1>Финансовый навигатор</h1><p>Загружаем новую версию сайта…</p><div class="s"></div></div>
<script>
(function(){
  var files=['p1.txt','p2.txt','p3.txt','p4.txt','p5.txt','p6.txt'];
  Promise.all(files.map(function(file){
    return fetch(file,{cache:'no-store'}).then(function(response){
      if(!response.ok) throw new Error(file+': HTTP '+response.status);
      return response.text();
    });
  })).then(function(parts){
    document.open();
    document.write(parts.join(''));
    document.close();
  }).catch(function(error){
    console.error(error);
    document.body.innerHTML='<div class="c"><div class="m">!</div><h1>Не удалось открыть сайт</h1><p>Обновите страницу. Новая версия загружается напрямую без архивов, распаковки и внешних библиотек.</p></div>';
  });
})();
</script>
</body>
</html>
